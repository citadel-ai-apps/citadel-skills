<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOME</title>
  <style>
    /* Colori in un punto solo. --accent e --accent-2 sono lo stile aziendale (vedi la scheda, sezione Aspetto). */
    :root { --bg: #f6f5f1; --fg: #1c1c1a; --muted: #6b6a64; --card: #fff; --line: #e3e1da; --accent: #2f5d50; --on-accent: #fff; --accent-2: #8a4b12; --warn: #8a4b12; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #141413; --fg: #ecebe6; --muted: #a09f98; --card: #1e1e1c; --line: #2e2e2b; --accent: #8cc2b0; --on-accent: #141413; --accent-2: #e2a56b; --warn: #e2a56b; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #141413; --fg: #ecebe6; --muted: #a09f98; --card: #1e1e1c; --line: #2e2e2b; --accent: #8cc2b0; --on-accent: #141413; --accent-2: #e2a56b; --warn: #e2a56b; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    main { max-width: 40rem; margin: 0 auto; }
    .scheda { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.25rem; }
    .muto { color: var(--muted); }
    .errore { color: var(--warn); }
    button { font: inherit; padding: .45rem 1rem; border-radius: 999px; border: 1px solid var(--accent);
      background: var(--accent); color: var(--on-accent); cursor: pointer; }
    header { display: flex; align-items: center; gap: .75rem; }
    header img { height: 2rem; }
    header h1 { margin: 0; font-size: 1.4rem; flex: 1; }
    #tema { background: transparent; color: var(--fg); border-color: var(--line); padding: .3rem .7rem; }
    input, select, textarea { font: inherit; width: 100%; padding: .5rem; border: 1px solid var(--line);
      border-radius: 8px; background: var(--card); color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <header>
      <!-- <img src="logo.svg" alt="NOME"> se la scheda prevede un logo -->
      <h1>NOME</h1>
      <button id="tema" type="button" aria-label="Cambia tema chiaro/scuro">◐</button>
    </header>
    <p id="stato" class="muto" role="status"></p>
    <section id="contenuto" class="scheda"></section>
  </main>
  <script type="module">
    import { creaClient } from './api.js';
    const api = creaClient({ fetch: window.fetch.bind(window), storage: window.localStorage });
    // Interruttore chiaro/scuro: la scelta vince sul sistema e resta salvata, se lo storage c'è.
    const root = document.documentElement;
    try { const t = localStorage.getItem('tema'); if (t) root.dataset.theme = t; } catch { /* nessuna preferenza */ }
    document.getElementById('tema').addEventListener('click', () => {
      const scuro = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = scuro ? 'light' : 'dark';
      try { localStorage.setItem('tema', root.dataset.theme); } catch { /* solo per questa visita */ }
    });

    // Qui le schermate dell'app.
  </script>
</body>
</html>
