<!doctype html>
<!-- lang: the app's language from the spec (`language`), e.g. "en" or "it". -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAME</title>
  <style>
    /* Colours in one place. --accent and --accent-2 are the company style (see the spec, Look section). */
    :root { --bg: #f6f5f1; --fg: #1c1c1a; --muted: #6b6a64; --card: #fff; --line: #e3e1da; --accent: #2f5d50; --on-accent: #fff; --accent-2: #8a4b12; --warn: #8a4b12; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #141413; --fg: #ecebe6; --muted: #a09f98; --card: #1e1e1c; --line: #2e2e2b; --accent: #8cc2b0; --on-accent: #141413; --accent-2: #e2a56b; --warn: #e2a56b; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #141413; --fg: #ecebe6; --muted: #a09f98; --card: #1e1e1c; --line: #2e2e2b; --accent: #8cc2b0; --on-accent: #141413; --accent-2: #e2a56b; --warn: #e2a56b; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    main { max-width: 40rem; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.25rem; }
    .muted { color: var(--muted); }
    .error { color: var(--warn); }
    button { font: inherit; padding: .45rem 1rem; border-radius: 999px; border: 1px solid var(--accent);
      background: var(--accent); color: var(--on-accent); cursor: pointer; }
    header { display: flex; align-items: center; gap: .75rem; }
    header img { height: 2rem; }
    header h1 { margin: 0; font-size: 1.4rem; flex: 1; }
    #theme { background: transparent; color: var(--fg); border-color: var(--line); padding: .3rem .7rem; }
    input, select, textarea { font: inherit; width: 100%; padding: .5rem; border: 1px solid var(--line);
      border-radius: 8px; background: var(--card); color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <header>
      <!-- <img src="logo.svg" alt="NAME"> if the spec has a logo -->
      <h1>NAME</h1>
      <!-- aria-label in the app's language -->
      <button id="theme" type="button" aria-label="Switch light/dark theme">◐</button>
    </header>
    <p id="status" class="muted" role="status"></p>
    <section id="content" class="card"></section>
  </main>
  <script type="module">
    import { createClient } from './api.js';
    // Pass `messages` in the app's language when it is not English (see api.js).
    const api = createClient({ fetch: window.fetch.bind(window), storage: window.localStorage });
    // Light/dark switch: the choice wins over the system and is saved, if storage is available.
    const root = document.documentElement;
    try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch { /* no preference */ }
    document.getElementById('theme').addEventListener('click', () => {
      const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch { /* this visit only */ }
    });

    // The app's screens go here.
  </script>
</body>
</html>
